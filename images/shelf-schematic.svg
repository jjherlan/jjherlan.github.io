<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Schematic of the continental shelf and slope</title>
  <desc id="d">A cross-section from the coast across the continental shelf, down the slope and into a submarine canyon, with predicted habitat for deep-sea corals and sponges shaded along the slope and canyon walls.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3d1"/><stop offset="0.45" stop-color="#2f7f88"/><stop offset="1" stop-color="#0b2230"/>
    </linearGradient>
    <linearGradient id="hab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b36b" stop-opacity="0"/><stop offset="0.5" stop-color="#f2b36b" stop-opacity="0.9"/><stop offset="1" stop-color="#f2b36b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sea)"/>
  <rect width="800" height="70" fill="#e9f2ef"/>
  <path d="M0 70 L0 150 L330 175 C 400 182, 430 200, 470 260 C 520 340, 540 390, 575 470 L 600 520 L 630 470 C 660 420, 700 430, 800 470 L 800 600 L 0 600 Z" fill="#d9c9a8"/>
  <path d="M0 150 L330 175 C 400 182, 430 200, 470 260 C 520 340, 540 390, 575 470 L 600 520 L 630 470 C 660 420, 700 430, 800 470" fill="none" stroke="#8a7650" stroke-width="3"/>
  <path d="M440 222 C 480 270, 520 340, 548 410 C 560 440, 572 470, 588 505" fill="none" stroke="url(#hab)" stroke-width="22" stroke-linecap="round"/>
  <path d="M612 500 C 630 470, 650 448, 690 440" fill="none" stroke="#f2b36b" stroke-opacity="0.7" stroke-width="18" stroke-linecap="round"/>
  <g fill="#fff4e2" stroke="#b5651d" stroke-width="2">
    <path d="M500 312 l0 -22 m0 8 l-8 -8 m8 14 l8 -10"/>
    <path d="M532 372 l0 -22 m0 8 l-8 -8 m8 14 l8 -10"/>
    <path d="M565 445 l0 -20 m0 8 l-7 -8 m7 13 l7 -9"/>
    <path d="M655 448 l0 -20 m0 8 l-7 -8 m7 13 l7 -9"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" fill="#10242f" font-size="20">
    <text x="20" y="44" font-weight="600">Coast</text>
    <text x="150" y="140" fill="#f7f4ee">Continental shelf</text>
    <text x="560" y="250" fill="#f7f4ee">Slope</text>
    <text x="640" y="545" fill="#f7f4ee">Canyon</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="17" fill="#f7f4ee">
    <rect x="30" y="500" width="22" height="14" rx="3" fill="#f2b36b"/>
    <text x="62" y="513">Predicted coral and sponge habitat (schematic)</text>
  </g>
</svg>
